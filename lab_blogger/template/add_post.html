{% extends "base.html" %}

{% block title %}Blogger - New Post{% endblock %}

{% block content %}

    <h1 class="page-title">Write a New Post</h1>
    <p class="page-subtitle">Fill in the fields below and hit Publish.</p>

    <div class="form-card">
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.title.id_for_label }}">Title</label>
                {{ form.title }}
                {{ form.title.errors }}
            </div>

            <div class="form-group">
                <label for="{{ form.content.id_for_label }}">Content</label>
                {{ form.content }}
                {{ form.content.errors }}
            </div>

            <div>
                <button type="submit" class="btn btn-primary">Publish Post</button>
                <a href="{% url 'lab_blogger:home' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>

{% endblock %}
