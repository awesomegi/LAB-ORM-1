{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blogger{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <header class="navbar">
        <a href="{% url 'lab_blogger:home' %}" class="logo">Blog<span>ger</span></a>
        <nav>
            <a href="{% url 'lab_blogger:home' %}">Home</a>
            <a href="{% url 'lab_blogger:add_post' %}">+ New Post</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Made with <span>&#9825;</span> &mdash; Blogger &copy; 2026</p>
    </footer>

</body>
</html>
